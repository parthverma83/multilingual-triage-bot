services:
  - type: web
    name: medroute-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.app:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: APP_NAME
        value: MedRoute AI
      - key: APP_VERSION
        value: 1.0.0
      - key: MODEL_PROVIDER
        value: colab
      - key: MODEL_ENDPOINT
        sync: false          # Set this manually in Render dashboard each Colab session
      - key: MODEL_API_KEY
        value: ""
      - key: MODEL_TIMEOUT_SECONDS
        value: 90
      - key: MODEL_RETRY_ATTEMPTS
        value: 2
